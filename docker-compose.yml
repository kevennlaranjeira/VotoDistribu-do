services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: sd-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-yan}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-yan}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - rede

  postgres_core:
    image: postgres:16
    container_name: bd_sd_core
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_CORE_DB:-core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_CORE_DB:-core}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - rede

  postgres_eleicao:
    image: postgres:16
    container_name: postgres_eleicao
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_ELEICAO_DB:-eleicao}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    volumes:
      - postgres_eleicao_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_ELEICAO_DB:-eleicao}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - rede

  agregador:
    build:
      context: ./core
    container_name: agregador
    restart: unless-stopped
    depends_on:
      postgres_core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_core:5432/${POSTGRES_CORE_DB:-core}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-yan}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-yan}
    ports:
      - "${CORE_PORT:-28081}:8081"
    networks:
      - rede

  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx_balanceador
    restart: unless-stopped
    ports:
      - "${COLETOR_PORT:-28080}:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - rede

  coletor:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres_eleicao:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nginx-proxy:
        condition: service_started
    environment:
      VIRTUAL_HOST: localhost,coletor.local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_eleicao:5432/${POSTGRES_ELEICAO_DB:-eleicao}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-yan}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-yan}
      JWT_SECRET: ${JWT_SECRET:-MN4064ZQbSAr4cijQMphT8dbpGgJoOaeL6aFF/wKhkA=}
    networks:
      - rede

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - agregador
      - coletor
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    networks:
      - rede

volumes:
  postgres_core_data:
  postgres_eleicao_data:

networks:
  rede:
    driver: bridge
