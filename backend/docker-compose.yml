services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx_balanceador
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - rede

  coletor:
    build:
      context: .
    environment:
      VIRTUAL_HOST: coletor.local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_eleicao:5432/eleicao
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: yan
      SPRING_RABBITMQ_PASSWORD: yan
      JWT_SECRET: MN4064ZQbSAr4cijQMphT8dbpGgJoOaeL6aFF/wKhkA=

    networks:
      rede:
        aliases:
          - coletor1
          - coletor2
          - coletor3

networks:
  rede:
    external: true
