services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx_balanceador
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - rede

  coletor:
    build:
      context: .
    environment:
      VIRTUAL_HOST: coletor.local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_eleicao:5432/eleicao
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-voto_dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-voto_dev_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-voto_dev}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-voto_dev_password}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktand0LXNlY3JldC0zMi1ieXRlcy1rZXktMDAwMA==}
      APP_ADMIN_NICK: ${APP_ADMIN_NICK:-admin}

    networks:
      rede:
        aliases:
          - coletor1
          - coletor2
          - coletor3

networks:
  rede:
    external: true
