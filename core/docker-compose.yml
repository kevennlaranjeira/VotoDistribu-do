services:
  agregador:
    build:
      context: ./
    container_name: agregador
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_core:5432/core
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: yan
      SPRING_RABBITMQ_PASSWORD: yan
    ports:
      - "8081:8081"
    networks:
      - rede

networks:
  rede:
    external: true
